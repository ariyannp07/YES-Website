<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Yale Entrepreneurial Society member events."
    />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#090f17" />
    <title>Calendar — Yale Entrepreneurial Society</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./script.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#events">Skip to events</a>
    <div class="calendar-shell">
      <header class="masthead">
        <a
          class="wordmark"
          href="/"
          target="_top"
          aria-label="Yale Entrepreneurial Society home"
          ><span class="yes-logo" aria-hidden="true"><span class="yes-logo-bars"></span><span class="yes-logo-center"></span></span></a
        >
        <form action="/api/calendar/auth/logout" method="post" target="_top">
          <button class="signout" type="submit">Sign out</button>
        </form>
      </header>
      <main>
        <section
          id="events"
          class="events-section"
          aria-labelledby="page-title"
          tabindex="-1"
        >
          <div class="section-bar">
            <div class="section-heading">
              <h1 id="page-title">Calendar</h1>
            </div>
            <div class="view-switch" role="group" aria-label="Calendar view">
              <button type="button" data-view="agenda" aria-pressed="true">
                Upcoming</button
              ><button type="button" data-view="month" aria-pressed="false">
                Month
              </button>
            </div>
          </div>
          <div class="filter-bar" hidden>
            <div
              id="filters"
              role="group"
              aria-label="Filter by event type"
            ></div>
            <div class="filter-summary">
              <span id="event-count" class="event-count"></span>
            </div>
          </div>
          <p id="calendar-context" class="visually-hidden">Upcoming events</p>
          <div id="month-navigation" class="month-navigation" hidden>
            <h2 id="month-title"></h2>
            <div>
              <button
                id="previous-month"
                type="button"
                aria-label="Previous month"
              >
                ←</button
              ><button id="today" type="button">Today</button
              ><button id="next-month" type="button" aria-label="Next month">
                →
              </button>
            </div>
          </div>
          <p id="status" class="status" data-state="loading" role="status" aria-live="polite">
            Loading events…
          </p>
          <button id="retry" class="retry" type="button" hidden>
            Try again ↗
          </button>
          <div id="calendar-content" aria-busy="true"></div>
          <noscript
            ><p class="status">
              Please enable JavaScript to view the events calendar.
            </p></noscript
          >
        </section>
      </main>
      <footer>
        <span>Yale Entrepreneurial Society</span>
      </footer>
    </div>
    <dialog id="event-dialog" aria-labelledby="detail-title">
      <div class="dialog-top">
        <span class="eyebrow">Event details</span
        ><button
          id="close-dialog"
          type="button"
          aria-label="Close event details"
        >
          <span aria-hidden="true">×</span>
        </button>
      </div>
      <div id="event-detail"></div>
    </dialog>
  </body>
</html>
